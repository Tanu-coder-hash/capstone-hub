services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: capstone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capstone}
      POSTGRES_DB: capstone
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capstone"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://capstone:${POSTGRES_PASSWORD:-capstone}@db:5432/capstone
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Tools: start with 'docker compose --profile tools up -d'
  sonarqube:
    image: sonarqube:community
    ports:
      - "9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
    profiles: ["tools"]

  jenkins:
    build: ./jenkins
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    profiles: ["tools"]

volumes:
  pgdata:
  sonar_data:
  jenkins_home: